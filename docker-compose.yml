services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # Phải khớp với DB_* trong frontend/.env.local
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: finance_app
      MYSQL_USER: finance_user
      MYSQL_PASSWORD: finance_password
    ports:
      # Host 3307 -> tránh trùng với MySQL cài native (nếu có) đang chiếm 3306 trên máy.
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Tự động chạy 1 lần duy nhất khi tạo container lần đầu (volume rỗng).
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      # Trong mạng Docker, app gọi DB qua service "db" ở cổng nội bộ 3306
      # (3307 chỉ là cổng map ra máy host).
      DB_HOST: db
      DB_PORT: "3306"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
