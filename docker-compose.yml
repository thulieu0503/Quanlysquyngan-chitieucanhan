services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # Phải khớp với DB_* trong frontend/.env.local
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: finance_app
      MYSQL_USER: finance_user
      MYSQL_PASSWORD: finance_password
    ports:
      # Host 3307 -> tránh trùng với MySQL cài native (nếu có) đang chiếm 3306 trên máy.
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Tự động chạy 1 lần duy nhất khi tạo container lần đầu (volume rỗng).
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  # Hộp thư giả cho môi trường dev: nhận email từ app (SMTP :1025), xem tại http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Trong mạng Docker, api gọi DB/mailpit qua tên service (không phải cổng map ra host).
      DB_HOST: db
      DB_PORT: "3306"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      # Trong mạng Docker, app gọi API qua tên service "api" ở cổng nội bộ 8000.
      BACKEND_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db_data:
